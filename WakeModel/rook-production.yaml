model_name: rook
target_phrases: ["rook"]

n_samples: 25000
n_samples_val: 5000
n_background_samples: 2000
n_background_samples_val: 500
tts_batch_size: 50

custom_negative_phrases:
  - "look"
  - "book"
  - "brook"
  - "brooke"
  - "crook"
  - "hook"
  - "room"
  - "root"
  - "look open"
  - "book open"
  - "brooke open"
  - "the rook"
  - "a rook"
  - "rookie"
  - "rule"

data_dir: ./.artifacts.noindex/wake-training/data
output_dir: ./.artifacts.noindex/wake-training/output

augmentation:
  clip_duration: 2.0
  batch_size: 16
  rounds: 3
  background_paths: [./.artifacts.noindex/wake-training/data/backgrounds]
  rir_paths: [./.artifacts.noindex/wake-training/data/rirs]

model:
  model_type: conv_attention
  model_size: medium

steps: 100000
learning_rate: 0.0001
weight_decay: 0.01
label_smoothing: 0.05
max_negative_weight: 4000
target_fp_per_hour: 0.04

batch_n_per_class:
  positive: 50
  adversarial_negative: 80
  ACAV100M_sample: 1024
  background_noise: 80
